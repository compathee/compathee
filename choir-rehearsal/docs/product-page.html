		function fetchJson(url) {
			return fetch(url, { cache: 'no-store' }).then(function (response) {
				if (!response.ok) throw new Error('HTTP ' + response.status);
				return response.json();
			});
		}

		function fetchFirst(urls) {
			function attempt(index) {
				if (index >= urls.length) return Promise.reject(new Error(urls[0] || 'missing'));
				return fetchJson(urls[index]).catch(function () { return attempt(index + 1); });
			}
			return attempt(0);
		}

		function fetchJsonFromRepo(path) {
			var remote = CONFIG.branches.map(function (branch) { return rawUrl(branch, path); });
			if (!isLocal()) return fetchFirst(remote);
			var local = path.indexOf('update.json') !== -1
				? ['update.json', '../update.json']
				: ['product-data.json'];
			return fetchFirst(local.concat(remote));
		}

		function withTimeout(promise, ms, fallback) {
			return new Promise(function (resolve) {
				var settled = false;
				var timer = setTimeout(function () {
					if (!settled) { settled = true; resolve(fallback); }
				}, ms);
				promise.then(function (value) {
					if (!settled) { settled = true; clearTimeout(timer); resolve(value); }
				}, function () {
					if (!settled) { settled = true; clearTimeout(timer); resolve(fallback); }
				});
			});
		}

		function compareVersions(a, b) {
			var pa = String(a || '0').split('.').map(function (n) { return parseInt(n, 10) || 0; });
			var pb = String(b || '0').split('.').map(function (n) { return parseInt(n, 10) || 0; });
			for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
				var na = pa[i] || 0;
				var nb = pb[i] || 0;
				if (na !== nb) return na > nb ? 1 : -1;
			}
			return 0;
		}

		function findLatestRelease(releases) {
			var best = null;
			var bestVersion = '';
			(releases || []).forEach(function (release) {
				if (!release || release.draft || release.prerelease) return;
				var tag = String(release.tag_name || '');
				if (tag.indexOf('choir-rehearsal-pro-v') === 0) return;
				var version = '';
				if (tag.indexOf('compath-choir-rehearsal-v') === 0) version = tag.slice('compath-choir-rehearsal-v'.length);
				else if (tag.indexOf('choir-rehearsal-v') === 0) version = tag.slice('choir-rehearsal-v'.length);
				else return;
				if (!best || compareVersions(version, bestVersion) > 0) {
					best = release;
					bestVersion = version;
				}
			});
			return { release: best, version: bestVersion };
		}

		function getDownloadUrl(release) {

			var preferred = ['compath-choir-rehearsal.zip', 'choir-rehearsal.zip'];
			for (var p = 0; p < preferred.length; p++) {
				for (var i = 0; i < release.assets.length; i++) {
					if (release.assets[i].name === preferred[p]) return release.assets[i].browser_download_url;
				}

		}

		function pageFromLocation(entries) {
			var count = Math.max(1, Math.ceil((entries || []).length / PAGE_SIZE));
			var page = parseInt(new URLSearchParams(location.search).get('page') || '1', 10);
			var hash = location.hash || '';
			var pageMatch = hash.match(/^#changelog-page-(\d+)$/);
			if (pageMatch) page = parseInt(pageMatch[1], 10);
			else if (/^#changelog-.+/.test(hash)) {
				var version = decodeURIComponent(hash.slice('#changelog-'.length));
				for (var i = 0; i < entries.length; i++) {
					if (String(entries[i].version) === version) {
						page = Math.floor(i / PAGE_SIZE) + 1;
						break;
					}
				}
			}
			if (!page || page < 1) page = 1;
			if (page > count) page = count;
			return page;
		}

		function hashForPage(hash, page) {
			if (/^#changelog-page-\d+$/.test(hash)) return page > 1 ? '#changelog-page-' + page : '#changelog';
			if (/^#changelog-.+/.test(hash)) {
				var version = decodeURIComponent(hash.slice('#changelog-'.length));
				var idx = -1;
				for (var i = 0; i < state.entries.length; i++) {
					if (String(state.entries[i].version) === version) { idx = i; break; }
				}
				if (idx >= 0 && Math.floor(idx / PAGE_SIZE) + 1 !== page) {
					return page > 1 ? '#changelog-page-' + page : '#changelog';
				}
			}
			return hash;
		}

				else params.delete('page');
			}
			var hash = state.data ? hashForPage(location.hash || '', state.page) : (location.hash || '');
			var url = location.pathname + '?' + params.toString() + hash;
			if (url !== location.pathname + location.search + location.hash) {
				history.replaceState({ lang: state.lang, page: state.page }, '', url);

				}
				return;
			}
			if (/^#changelog-page-\d+$/.test(hash)) {
				var changelog = document.getElementById('changelog');
				if (changelog) changelog.scrollIntoView();
				return;
			}
			if (/^#changelog-.+/.test(hash)) {
				var version = decodeURIComponent(hash.slice('#changelog-'.length));
				var entry = document.getElementById('changelog-' + version);
				if (entry) {
					if (entry.tagName === 'DETAILS') entry.open = true;
					entry.scrollIntoView();
				}
				return;
			}
			var target = document.getElementById(decodeURIComponent(hash.slice(1)));
			if (target) target.scrollIntoView();
		}

		function showPage(page, opts) {
			opts = opts || {};
			var count = pageCount();
			if (page < 1) page = 1;
			if (page > count) page = count;
			state.page = page;
			var pages = document.querySelectorAll('#app .changelog-page');
			for (var i = 0; i < pages.length; i++) {
				var n = parseInt(pages[i].getAttribute('data-page'), 10);
				if (n === page) pages[i].removeAttribute('hidden');
				else pages[i].setAttribute('hidden', '');
			}
			var buttons = document.querySelectorAll('#app .pager [data-pager]');
			for (var b = 0; b < buttons.length; b++) {
				var button = buttons[b];
				var kind = button.getAttribute('data-pager');
				if (kind === 'prev') button.disabled = page <= 1;
				else if (kind === 'next') button.disabled = page >= count;
				else if (parseInt(kind, 10) === page) button.setAttribute('aria-current', 'page');
				else button.removeAttribute('aria-current');
			}
			var status = document.getElementById('changelog-status');
			var template = (state.pack.ui && state.pack.ui.page) || 'Page {n}';
			if (status) status.textContent = template.replace('{n}', String(page));
			syncUrl();
			if (opts.scroll) {
				var section = document.getElementById('changelog');
				if (section) section.scrollIntoView();
			}
			if (opts.focus) {
				var current = document.querySelector('#app .pager [aria-current="page"]');
				if (current) current.focus();
			}
		}

		function render(opts) {
			opts = opts || {};
			var y = window.scrollY;
			state.pack = resolvePack(state.data, state.lang);
			state.entries = state.data.changelog || [];
			state.page = pageFromLocation(state.entries);
			if (state.pack.documentTitle) document.title = state.pack.documentTitle;
			var meta = document.querySelector('meta[name="description"]');
			if (meta && state.pack.metaDescription) meta.setAttribute('content', state.pack.metaDescription);
			document.getElementById('app').innerHTML = buildHtml();
			document.getElementById('app').setAttribute('data-ready', '1');
			updateSwitcher();
			syncUrl();
			if (opts.keepScroll) window.scrollTo(0, y);
			else if (opts.reveal) revealHash();
		}

		function showError(message) {
			document.getElementById('app').innerHTML =
				'<div class="error"><strong>Could not load content from GitHub.</strong><p>' + esc(message) + '</p>' +
				'<p>Try <a href="' + esc(CONFIG.wordpressOrgUrl) + '">WordPress.org</a> or email <a href="mailto:order@compath.ee">order@compath.ee</a>.</p></div>';
			document.getElementById('app').setAttribute('data-ready', 'error');
		}

		state.lang = detectLang();
		updateSwitcher();
		syncUrl();
		var loading = document.querySelector('#app .loading');
		if (loading) loading.textContent = LOADING[state.lang] || LOADING.en;

		document.getElementById('lang').addEventListener('change', function (event) {
			var lang = normalizeLang(event.target.value);
			if (!lang || lang === state.lang) return;
			state.lang = lang;
			updateSwitcher();
			if (state.data) render({ keepScroll: true });
			else syncUrl();
		});

		function copyText(value) {
			if (navigator.clipboard && navigator.clipboard.writeText) {
				return navigator.clipboard.writeText(value).catch(function () { return fallbackCopy(value); });
			}
			return fallbackCopy(value);
		}

		function fallbackCopy(value) {
			return new Promise(function (resolve, reject) {
				var area = document.createElement('textarea');
				area.value = value;
				area.setAttribute('readonly', '');
				area.style.position = 'fixed';
				area.style.left = '-9999px';
				document.body.appendChild(area);
				area.select();
				try {
					if (!document.execCommand('copy')) throw new Error('copy failed');
					resolve();
				} catch (err) {
					reject(err);
				} finally {
					document.body.removeChild(area);
				}
			});
		}

		document.getElementById('app').addEventListener('click', function (event) {
			var copyButton = event.target.closest ? event.target.closest('[data-copy]') : null;
			if (copyButton) {
				var value = copyButton.getAttribute('data-copy') || '';
				var label = copyButton.getAttribute('data-label') || copyButton.textContent;
				var copied = textOf(state.pack || {}, 'demoCopied');
				copyText(value).then(function () {
					copyButton.textContent = copied;
					var status = document.getElementById('copy-status');
					if (status) status.textContent = copied;
					window.setTimeout(function () {
						if (copyButton.textContent === copied) copyButton.textContent = label;
					}, 2000);
				}).catch(function () {});
				return;
			}
			var button = event.target.closest ? event.target.closest('[data-pager]') : null;
			if (!button || button.disabled) return;
			var kind = button.getAttribute('data-pager');
			var next = state.page;
			if (kind === 'prev') next -= 1;
			else if (kind === 'next') next += 1;
			else next = parseInt(kind, 10);
			showPage(next, { scroll: true });
		});

		document.getElementById('app').addEventListener('keydown', function (event) {
			if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
			if (!event.target.closest || !event.target.closest('.pager')) return;
			event.preventDefault();
			showPage(state.page + (event.key === 'ArrowRight' ? 1 : -1), { focus: true });
		});

		window.addEventListener('hashchange', function () {
			if (!state.data) return;
			var page = pageFromLocation(state.entries);
			if (page !== state.page) showPage(page, { scroll: false });
			revealHash();
		});

		window.addEventListener('popstate', function () {
			state.lang = detectLang();
			updateSwitcher();
			if (state.data) render({ reveal: true });
		});

		Promise.all([
			fetchJsonFromRepo('choir-rehearsal/docs/product-data.json'),
			fetchJsonFromRepo('choir-rehearsal/update.json').catch(function () { return {}; }),
			withTimeout(fetch(CONFIG.releasesUrl, { cache: 'no-store' }).then(function (response) {
				return response.ok ? response.json() : [];
			}), 4000, [])
		]).then(function (results) {
			state.data = results[0];
			var updateMeta = results[1] || {};
			var found = findLatestRelease(results[2]);
			var releaseVersion = found.version || '';
			var jsonVersion = updateMeta.version ? String(updateMeta.version) : '';
			state.lite = state.data.liteVersion || '0.4.63';
			if (releaseVersion && compareVersions(releaseVersion, state.lite) > 0) state.lite = releaseVersion;
			if (jsonVersion && compareVersions(jsonVersion, state.lite) > 0) state.lite = jsonVersion;
			state.pro = state.data.proVersion || '0.5.0';
			state.downloadUrl = getDownloadUrl(found.release);
			if (updateMeta.download_url && (!releaseVersion || compareVersions(jsonVersion, releaseVersion) > 0)) {
				state.downloadUrl = updateMeta.download_url;
			}
			render({ reveal: true });
		}).catch(function (err) {
			showError(err && err.message ? err.message : String(err));
		});
	})();
	</script>
</body>
</html>
