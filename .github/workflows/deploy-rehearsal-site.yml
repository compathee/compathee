name: Deploy rehearsal.compath.ee

on:
  push:
    branches: [main, cursor/fix-plugin-updater-1441, cursor/choir-rehearsal-plugin-090e, cursor/sync-rehearsal-site-a04b]
    paths:
      - 'choir-rehearsal/docs/product-page.html'
      - 'choir-rehearsal/docs/deploy/**'
      - '.github/workflows/deploy-rehearsal-site.yml'
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static shell (loads content from GitHub at runtime)
        run: |
          set -euo pipefail
          mkdir -p deploy
          # Allow-list of the web root. Add a file here to publish it.
          # Never copy choir-rehearsal/docs/deploy/api/ — that folder is live on the server.
          cp choir-rehearsal/docs/product-page.html deploy/index.html
          cp choir-rehearsal/docs/deploy/.htaccess deploy/.htaccess
          cp choir-rehearsal/docs/deploy/health.txt deploy/health.txt
          for name in \
            favicon.ico \
            favicon.svg \
            apple-touch-icon.png \
            favicon-192x192.png \
            favicon-512x512.png \
            site.webmanifest
          do
            cp "choir-rehearsal/docs/deploy/${name}" "deploy/${name}"
          done
          if find deploy -type d -name api | grep -q .; then
            echo "Refusing to stage api/ for FTP" >&2
            exit 1
          fi
          ls -la deploy/
          echo "Shell deployed once — page content comes from product-data.json on GitHub"

      - name: Deploy to rehearsal.compath.ee (FTP/FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.REHEARSAL_FTP_SERVER }}
          username: ${{ secrets.REHEARSAL_FTP_USERNAME }}
          password: ${{ secrets.REHEARSAL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: ${{ secrets.REHEARSAL_FTP_REMOTE_DIR }}
          # api/ holds the live relay, config.php, feedback-rate/, and logs.
          # This job uploads only the static shell and must not replace that folder.
          dangerous-clean-slate: false
          exclude: |
            api/**
            **/api/**

      - name: Fix remote permissions (Apache 403)
        env:
          FTP_SERVER: ${{ secrets.REHEARSAL_FTP_SERVER }}
          FTP_USER: ${{ secrets.REHEARSAL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.REHEARSAL_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.REHEARSAL_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp -u "${FTP_USER}","${FTP_PASS}" "${FTP_SERVER}" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          cd ${FTP_DIR}
          chmod 755 .
          chmod 644 index.html
          chmod 644 .htaccess
          chmod 644 health.txt
          chmod 644 favicon.ico
          chmod 644 favicon.svg
          chmod 644 apple-touch-icon.png
          chmod 644 favicon-192x192.png
          chmod 644 favicon-512x512.png
          chmod 644 site.webmanifest
          bye
          EOF

      - name: Verify health.txt is reachable
        run: |
          set -euo pipefail
          for URL in "https://rehearsal.compath.ee/health.txt" "http://rehearsal.compath.ee/health.txt"; do
            echo "Checking ${URL}"
            if curl -fsSL --max-time 30 "${URL}" | grep -q "deploy OK"; then
              echo "OK: ${URL}"
              exit 0
            fi
          done
          echo "::warning::Site not reachable yet. Check REHEARSAL_FTP_REMOTE_DIR and subdomain document root."
          exit 0
