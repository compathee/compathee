name: Deploy rehearsal.compath.ee

on:
  push:
    branches: [main, cursor/fix-plugin-updater-1441, cursor/choir-rehearsal-plugin-090e, cursor/sync-rehearsal-site-a04b]
    paths:
      - 'choir-rehearsal/docs/product-data.json'
      - 'choir-rehearsal/docs/seo-copy.json'
      - 'choir-rehearsal/docs/build-site.mjs'
      - 'choir-rehearsal/docs/site.css'
      - 'choir-rehearsal/docs/site.js'
      - 'choir-rehearsal/docs/deploy/**'
      - '.github/workflows/deploy-rehearsal-site.yml'
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static language pages
        run: |
          set -euo pipefail
          node choir-rehearsal/docs/build-site.mjs
          rm -rf deploy
          mkdir deploy
          # dist is an allow-list: language folders, crawl files, and the public assets.
          # Never copy choir-rehearsal/docs/deploy/api/ — that folder is live on the server.
          cp -a choir-rehearsal/docs/dist/. deploy/
          if find deploy -type d -name api | grep -q .; then
            echo "Refusing to stage api/ for FTP" >&2
            exit 1
          fi
          find deploy -type d -exec chmod 755 {} \;
          find deploy -type f -exec chmod 644 {} \;
          find deploy -type f -o -type d | sort
          echo "Static pages built from product-data.json"

      - name: Deploy to rehearsal.compath.ee (FTP/FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.REHEARSAL_FTP_SERVER }}
          username: ${{ secrets.REHEARSAL_FTP_USERNAME }}
          password: ${{ secrets.REHEARSAL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: ${{ secrets.REHEARSAL_FTP_REMOTE_DIR }}
          # api/ holds the live relay, config.php, feedback-rate/, and logs.
          # This job uploads only the static shell and must not replace that folder.
          dangerous-clean-slate: false
          exclude: |
            api/**
            **/api/**

      - name: Fix remote permissions (Apache 403)
        env:
          FTP_SERVER: ${{ secrets.REHEARSAL_FTP_SERVER }}
          FTP_USER: ${{ secrets.REHEARSAL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.REHEARSAL_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.REHEARSAL_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp -u "${FTP_USER}","${FTP_PASS}" "${FTP_SERVER}" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          cd ${FTP_DIR}
          chmod 755 .
          chmod 755 et
          chmod 755 ru
          chmod 755 de
          chmod 755 fr
          chmod 755 it
          chmod 755 es
          chmod 755 sv
          chmod 755 fi
          chmod 644 index.html
          chmod 644 et/index.html
          chmod 644 ru/index.html
          chmod 644 de/index.html
          chmod 644 fr/index.html
          chmod 644 it/index.html
          chmod 644 es/index.html
          chmod 644 sv/index.html
          chmod 644 fi/index.html
          chmod 644 robots.txt
          chmod 644 sitemap.xml
          chmod 644 llms.txt
          chmod 644 llms-full.txt
          chmod 644 .htaccess
          chmod 644 health.txt
          chmod 644 favicon.ico
          chmod 644 favicon.svg
          chmod 644 apple-touch-icon.png
          chmod 644 favicon-192x192.png
          chmod 644 favicon-512x512.png
          chmod 644 site.webmanifest
          chmod 644 og-image.png
          chmod 644 compath-logo.png
          bye
          EOF

      - name: Verify health.txt is reachable
        run: |
          set -euo pipefail
          for URL in "https://rehearsal.compath.ee/health.txt" "http://rehearsal.compath.ee/health.txt"; do
            echo "Checking ${URL}"
            if curl -fsSL --max-time 30 "${URL}" | grep -q "deploy OK"; then
              echo "OK: ${URL}"
              exit 0
            fi
          done
          echo "::warning::Site not reachable yet. Check REHEARSAL_FTP_REMOTE_DIR and subdomain document root."
          exit 0
